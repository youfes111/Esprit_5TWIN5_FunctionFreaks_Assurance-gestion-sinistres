# TEMPLATE ONLY: replace this sentinel with a newly generated, private password
# in the existing FUSEKI_BASE/shiro.ini copy. This file is not a credential store.
# Never start with the sentinel and never commit a populated copy. No admin role
# or account is granted. Bind Fuseki to loopback (--localhost).
[users]
claims-writer = REPLACE_BEFORE_STARTING, claims-writer

[urls]
/$/** = perms[administration-disabled]
/assurance/update = authcBasic, roles[claims-writer]
/assurance/update/** = authcBasic, roles[claims-writer]
/** = anon
